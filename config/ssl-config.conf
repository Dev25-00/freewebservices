# Configuration SSL/TLS pour mini-services.tech
# Apache Virtual Host Configuration

<VirtualHost *:443>
    ServerName mini-services.tech
    ServerAlias www.mini-services.tech
    DocumentRoot D:/wamp64/www/miniservices

    # Configuration SSL
    SSLEngine on
    SSLCertificateFile /path/to/certificate.crt
    SSLCertificateKeyFile /path/to/private.key
    SSLCertificateChainFile /path/to/ca-bundle.crt

    # Configuration SSL avancée
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder on
    SSLCompression off

    # HSTS (HTTP Strict Transport Security)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # Headers de sécurité
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' cdnjs.cloudflare.com"

    # Configuration des logs
    ErrorLog ${APACHE_LOG_DIR}/mini-services_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/mini-services_ssl_access.log combined

    # Configuration PHP
    <Directory "D:/wamp64/www/miniservices">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Protection contre l'exécution de scripts dans les dossiers d'upload
        <FilesMatch "\.(php|php3|php4|php5|phtml|pl|py|jsp|asp|sh|cgi)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Dossiers d'upload sécurisés
    <Directory "D:/wamp64/www/miniservices/uploads">
        Options -Indexes -ExecCGI
        AddHandler cgi-script .php .pl .py .jsp .asp .sh .cgi
        AllowOverride None
        Require all granted
        
        # Bloquer l'exécution de tous les scripts
        <FilesMatch ".*">
            SetHandler default-handler
        </FilesMatch>
    </Directory>

    <Directory "D:/wamp64/www/miniservices/storage">
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all denied
    </Directory>

    # Compression Gzip
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
        AddOutputFilterByType DEFLATE application/json
    </IfModule>

    # Cache et expiration
    <IfModule mod_expires.c>
        ExpiresActive on
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType application/x-javascript "access plus 1 year"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/ico "access plus 1 month"
        ExpiresByType image/icon "access plus 1 month"
        ExpiresByType text/plain "access plus 1 month"
        ExpiresByType application/pdf "access plus 1 month"
    </IfModule>
</VirtualHost>

# Redirection HTTP vers HTTPS
<VirtualHost *:80>
    ServerName mini-services.tech
    ServerAlias www.mini-services.tech
    Redirect permanent / https://mini-services.tech/
</VirtualHost>